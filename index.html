function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { el.classList.add("in-view"); io.unobserve(el); } },
      { threshold: 0.15 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function Reveal({ children, delay = 0, className = "" }) {
  const ref = useReveal();
  return (
    <div ref={ref} className={`reveal ${className}`} style={{ animationDelay: `${delay}ms` }}>
      {children}
    </div>
  );
}

function useHashRoute() {
  const [hash, setHash] = useState(window.location.hash || "#/");
  useEffect(() => {
    const onChange = () => setHash(window.location.hash || "#/");
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  return hash;
}

function useCountUp(target, trigger) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!trigger) return;
    let start = null;
    const duration = 1200;
    function step(ts) {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      setVal(Math.floor(p * target * 10) / 10);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }, [trigger]);
  return val;
}

function RouteJourney() {
  const stops = ["Tétouan", "Tanger", "Aéroport", "Your Car"];
  const [active, setActive] = useState(0);
  useEffect(() => {
    const iv = setInterval(() => setActive((s) => (s + 1) % stops.length), 2200);
    return () => clearInterval(iv);
  }, []);
  const pct = (active / (stops.length - 1)) * 100;

  return (
    <div className="hidden lg:flex flex-col items-center absolute right-10 top-28 bottom-16 z-10">
      <div className="relative w-px flex-1 bg-white/20">
        <div className="absolute top-0 left-0 w-px bg-orange route-line" style={{ height: `${pct}%` }} />
        {stops.map((s, i) => (
          <div key={s} className="absolute -left-[5px]" style={{ top: `${(i / (stops.length - 1)) * 100}%` }}>

/* ----------------------------------- FEATURES / REVIEWS ----------------------------------- */

function Features() {
  const { t } = useLang();
  const ref = useReveal();
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => e.isIntersecting && setInView(true), { threshold: 0.4 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const rating = useCountUp(5.0, inView);
  const reviews = useCountUp(81, inView);

  const items = [
    { icon: Icon.shield, title: t.features.insurance, sub: t.features.insuranceSub },
    { icon: Icon.plane, title: t.features.delivery, sub: t.features.deliverySub },
    { icon: Icon.clock, title: t.features.service, sub: t.features.serviceSub },
    { icon: Icon.star, title: t.features.reviews, sub: t.features.reviewsSub },
  ];

  return (
    <section ref={ref} className="relative py-20 md:py-24 overflow-hidden">
      <img src={img("medina", 1800, 900)} alt="" className="absolute inset-0 w-full h-full object-cover" />
      <div className="absolute inset-0 bg-ink/85" />
      <div className="relative max-w-7xl mx-auto px-5 md:px-8 grid md:grid-cols-5 gap-8 items-center">
        <div className="md:col-span-4 grid grid-cols-2 md:grid-cols-4 gap-6">
          {items.map((it, i) => (
            <Reveal delay={i * 100} key={it.title}>
              <it.icon className="w-8 h-8 text-orange mb-3" />
              <div className="text-white font-display font-800">{it.title}</div>
              <div className="text-white/50 text-xs mt-1 leading-relaxed">{it.sub}</div>
            </Reveal>
          ))}
        </div>
        <Reveal delay={400} className="md:col-span-1">
          <div className="bg-white rounded-2xl p-5 text-center shadow-2xl">
            <div className="font-display font-900 text-lg">Google</div>
            <div className="flex justify-center gap-0.5 my-1 text-orange">
              {[...Array(5)].map((_, i) => <Icon.star key={i} className="w-4 h-4" />)}
            </div>
            <div className="font-display font-900 text-2xl">{rating.toFixed(1)}</div>
            <div className="text-ink/50 text-xs mb-3">({Math.round(reviews)} avis)</div>
            <div className="bg-ink text-white text-xs font-bold py-2 rounded-full">Voir les avis</div>
          </div>
        </Reveal>
      </div>
    </section>
  );
}

          <p className="text-ink/60 leading-relaxed">
            Notre équipe reste joignable 24h/24 et 7j/7 sur WhatsApp pour organiser votre location en
            quelques minutes, sans paperasse compliquée.
          </p>
          <div className="flex gap-8 mt-8">
            <div><div className="font-display font-900 text-3xl text-orange">81+</div><div className="text-xs text-ink/50 uppercase tracking-wide">Avis clients</div></div>
            <div><div className="font-display font-900 text-3xl text-orange">5</div><div className="text-xs text-ink/50 uppercase tracking-wide">Villes couvertes</div></div>
            <div><div className="font-display font-900 text-3xl text-orange">24/7</div><div className="text-xs text-ink/50 uppercase tracking-wide">Disponibilité</div></div>
          </div>
        </Reveal>
      </section>

      <PracticalInfo />

      <section className="max-w-5xl mx-auto px-5 md:px-8 py-16 md:py-20">
        <Reveal>
          <h2 className="font-display font-900 text-2xl uppercase mb-6">{t.footer.location}</h2>
          <div className="rounded-2xl overflow-hidden h-80 shadow-lg">
            <iframe title="map-full" className="w-full h-full" src={`https://www.google.com/maps?q=${encodeURIComponent(AGENCY.address)}&output=embed`} loading="lazy" />
          </div>
        </Reveal>
      </section>
    </div>
  );
}

/* ----------------------------------- APP ----------------------------------- */

function App() {
  const [lang, setLang] = useState("fr");
  const hash = useHashRoute();
  const t = STR[lang];

  useEffect(() => {
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.documentElement.lang = lang;
  }, [lang]);

  useEffect(() => { window.scrollTo(0, 0); }, [hash]);

  let page;
  if (hash.startsWith("#/flotte")) page = <FleetPage />;
  else if (hash.startsWith("#/reservation")) {
    const parts = hash.split("/");
    const presetCarId = parts[2];
    page = <BookingPage presetCarId={presetCarId} />;
  } else if (hash.startsWith("#/agence")) page = <AgencyPage />;
  else page = <HomePage />;

  return (
    <LangContext.Provider value={{ lang, setLang, t }}>
      <Navbar />
      {page}
      <Footer />
      <WhatsAppFloat />
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
